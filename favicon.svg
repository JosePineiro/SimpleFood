<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Escáner de productos">
	<title>Escáner de productos — SIMPLEGYM</title>

	<!-- Fondo: color primario de la app -->
	<rect width="64" height="64" rx="0" fill="#08f"/>

	<!-- Octógono negro (sello de advertencia, como en la pantalla del escáner) -->
	<polygon points="22,4 46,4 60,18 60,46 46,60 22,60 4,46 4,18" fill="#000"/>

	<!-- Código de barras en blanco dentro del octógono -->
	<g fill="#fff">
		<rect x="11" y="20" width="2" height="24"/>
		<rect x="15" y="20" width="3" height="24"/>
		<rect x="20" y="20" width="2" height="24"/>
		<rect x="24" y="20" width="4" height="24"/>
		<rect x="30" y="20" width="2" height="24"/>
		<rect x="34" y="20" width="3" height="24"/>
		<rect x="39" y="20" width="2" height="24"/>
		<rect x="43" y="20" width="2" height="24"/>
		<rect x="47" y="20" width="3" height="24"/>
		<rect x="52" y="20" width="2" height="24"/>
	</g>
</svg>