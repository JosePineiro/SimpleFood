<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>SIMPLEFOOD - Escáner de productos</title>
		<link rel="icon" type="image/svg+xml" href="./favicon.svg">
		<link rel="stylesheet" href="css/styles.css">
		<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
		<script type="module" src="js/index.js"></script>
	</head>
	<body>
		<header class="topbar">
			<h1>SIMPLEFOOD</h1>
			<a href="ayuda.html" class="topbar-link">Ayuda</a>
		</header>
		<main class="container">
			<section class="dashboard-container">
				<article class="card">
					<div class="btn-panel">
						<button type="button" class="btn btn-primary" id="btn-iniciar">Escanear código</button>
						<button type="button" class="btn btn-secondary" id="btn-detener" hidden>Detener cámara</button>
						<button type="button" class="btn btn-secondary" id="btn-manual" aria-controls="form-manual-wrap">
							Introducir código
						</button>
					</div>

					<p class="card-text" id="estado-escaneo" role="status"></p>

					<div id="camara-panel" hidden>
						<h2>Escáner</h2>
						<p class="card-text">Apunta al código de barras (EAN-13 / UPC) del producto.</p>
						<div id="reader" class="video-wrap"></div>
					</div>

					<div id="form-manual-wrap" hidden>
						<form id="form-manual" class="finish-form form-inline" novalidate>
							<div class="form-row">
								<input
									id="codigo-manual"
									name="codigo"
									type="text"
									inputmode="numeric"
									autocomplete="off"
									pattern="\d{8,14}"
									placeholder="Ej. 8412345678905"
									required
								>
								<button type="submit" class="btn btn-primary">Buscar</button>
							</div>
						</form>
					</div>
				</article>

				<article class="card" id="resultado" hidden>
					<h2 id="nombre-producto">—</h2>
					<div id="producto-media" class="producto-media">
						<img id="foto-producto" alt="Foto del producto" class="producto-img" hidden>
						<div id="sellos" class="sellos"></div>
						<figure id="nutriscore-caja" class="nutriscore-caja" hidden>
							<a
								id="nutriscore-enlace"
								href="ayuda-sellos.html#nutriscore"
								target="_blank"
								rel="noopener"
								title="¿Qué significa el Nutri-Score?"
								><img id="nutriscore" alt="Nutri-Score" class="nutriscore-img"></a
							>
						</figure>
					</div>
					<p id="sellos-msg" class="card-text" aria-live="polite" hidden></p>
					<div id="denominacion-seccion">
						<h3>Denominación</h3>
						<p class="card-text" id="denominacion"></p>
					</div>
					<div id="denominacion-ingredientes">
						<h3>Ingredientes</h3>
						<p class="card-text" id="ingredientes"></p>
					</div>

					<h3 id="nutrientes-titulo">Información nutricional (por 100 g / ml)</h3>
					<dl class="stats" id="nutrientes">
						<div>
							<dt>Energía</dt>
							<dd id="energy-kcal"></dd>
						</div>
						<div>
							<dt>Grasas totales</dt>
							<dd id="fat"></dd>
						</div>
						<div>
							<dt>Grasas saturadas</dt>
							<dd id="saturated-fat"></dd>
						</div>
						<div>
							<dt>Sal</dt>
							<dd id="salt"></dd>
						</div>
						<div>
							<dt>Hidratos de carbono</dt>
							<dd id="carbohydrates"></dd>
						</div>
						<div>
							<dt>Azúcares</dt>
							<dd id="sugars"></dd>
						</div>
						<div>
							<dt>Fibra</dt>
							<dd id="fiber"></dd>
						</div>
						<div>
							<dt>Proteínas</dt>
							<dd id="proteins"></dd>
						</div>
					</dl>
				</article>

				<article class="card" id="error-card" hidden>
					<h2>Aviso</h2>
					<p class="card-text" id="error-msg"></p>
				</article>
			</section>
		</main>
	</body>
</html>
