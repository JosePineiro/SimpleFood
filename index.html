<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>SIMPLEFOOD - Escáner de productos</title>
		<link rel="icon" type="image/svg+xml" href="./favicon.svg">
		<link rel="stylesheet" href="css/styles.css">
		<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
		<script type="module" src="js/index.js"></script>
	</head>
	<body>
		<header class="topbar">
			<h1>SIMPLEFOOD</h1>
			<a href="ayuda.html" class="topbar-link">Ayuda</a>
		</header>
		<main class="container">
			<section class="dashboard-container">
				<article class="card">
					<div class="btn-panel">
						<button type="button" class="btn btn-primary" id="btn-iniciar">Escanear código</button>
						<button type="button" class="btn btn-secondary" id="btn-detener" hidden>Detener cámara</button>
						<button type="button" class="btn btn-secondary" id="btn-manual" aria-controls="form-manual-wrap">
							Introducir código
						</button>
					</div>

					<div id="camara-panel" hidden>
						<h2>Escáner</h2>
						<p class="card-text">Apunta al código de barras (EAN-13 / UPC) del producto.</p>
						<div id="reader" class="video-wrap"></div>
						<p class="card-text" id="estado-escaneo"></p>
					</div>

					<div id="form-manual-wrap" hidden>
						<form id="form-manual" class="finish-form form-inline" novalidate>
							<div class="form-row">
								<label>
									Código de barras
									<input
										id="codigo-manual"
										name="codigo"
										type="text"
										inputmode="numeric"
										autocomplete="off"
										pattern="\d{8,14}"
										placeholder="Ej. 8412345678905"
										required
									>
								</label>
								<button type="submit" class="btn btn-primary">Buscar</button>
							</div>
						</form>
					</div>
				</article>

				<article class="card" id="resultado" hidden>
					<h2 id="nombre-producto">—</h2>
					<img id="foto-producto" alt="Foto del producto" class="producto-img" hidden>
					<div id="sellos" class="sellos" aria-live="polite"></div>
					<figure id="nutriscore-caja" class="nutriscore-caja" hidden>
						<img id="nutriscore" alt="Nutri-Score" class="nutriscore-img">
					</figure>
					<div id="denominacion-seccion">
						<h3>Denominación</h3>
						<p class="card-text" id="denominacion"></p>
					</div>
					<div id="denominacion-ingredientes">
						<h3>Ingredientes</h3>
						<p class="card-text" id="ingredientes">—</p>
					</div>
					<h3 id="nutrientes-titulo">Información nutricional (por 100 g / ml)</h3>
					<dl class="stats" id="nutrientes"></dl>
				</article>

				<article class="card" id="error-card" hidden>
					<h2>Aviso</h2>
					<p class="card-text" id="error-msg"></p>
				</article>
			</section>
		</main>
	</body>
</html>
